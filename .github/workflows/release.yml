# Build Aulari.exe and Aulari.app on GitHub (never on a personal computer,
# design section 11) when a version tag such as v0.1.0 is pushed, and publish
# them as a release with their SHA-256 and a build provenance attestation.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the release
  id-token: write       # sign the provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pinned dependencies (hashes required)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Check that the tag matches the package version
        shell: pwsh
        run: |
          $version = python -c "import aulari; print(aulari.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
      - name: Lint and tests
        run: |
          ruff format --check
          ruff check
          python -m unittest discover -s tests -v
      - name: Check THIRD_PARTY_LICENSES is up to date
        run: |
          python packaging/make_third_party_licenses.py
          git diff --exit-code -- THIRD_PARTY_LICENSES
      - name: Build the executable
        run: pyinstaller --clean --noconfirm aulari.spec
      - name: Package and hash
        shell: pwsh
        run: |
          $zip = "Aulari-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path dist/Aulari -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ZIP }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ env.ZIP }}" "${{ env.ZIP }}.sha256" --generate-notes

  # macOS app (Apple Silicon) in a .dmg, added to the release the Windows job
  # created. It runs after it, so a macOS failure never blocks the Windows release.
  build-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pinned dependencies (hashes required)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint and tests
        run: |
          ruff format --check
          ruff check
          python -m unittest discover -s tests -v
      - name: Build the app
        run: pyinstaller --clean --noconfirm aulari.spec
      - name: Package and hash
        run: |
          test "$(uname -m)" = arm64
          dmg="Aulari-${{ github.ref_name }}-macos-arm64.dmg"
          packaging/make_dmg.sh "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.DMG }}
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.DMG }}" "${{ env.DMG }}.sha256"
