# Lint and tests on every push and pull request (Windows, as the app).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pinned dependencies (hashes required)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff format --check
          ruff check
      - name: Tests
        run: python -m unittest discover -s tests -v
