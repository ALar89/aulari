[build-system]
# Build backend only (pip downloads it for the install); not a runtime dependency.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aulari"
version = "0.3.0"
description = "Download and organize course material from a Moodle site"
requires-python = ">=3.14"
license = "MIT"
# Exact pinned versions live in requirements.txt.
dependencies = ["requests", "keyring", "tzdata"]

[project.urls]
Homepage = "https://github.com/ALar89/aulari"
Issues = "https://github.com/ALar89/aulari/issues"

[tool.setuptools.package-data]
# UI texts are data files inside the package.
aulari = ["strings/*.json"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PL", "C4"]
# Rules that contradict the project's structured style (CLAUDE.md section 3).
ignore = ["RET501", "RET502", "RET503", "RET504", "RET505", "SIM108", "SIM110", "PLR1714", "C4"]
